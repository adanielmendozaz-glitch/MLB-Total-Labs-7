name: Build Android APK V0

on:
  workflow_dispatch:
  push:
    branches: [ "main", "android-v7" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MLB_Total_Labs_7_0_V0-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLB_Total_Labs_7_0_V0_APK
          path: MLB_Total_Labs_7_0_V0-debug.apk
          retention-days: 30
