name: Build MLB Totals Lab V7.8.7.1 Dispersion Live Shadow APK

on:
  workflow_dispatch:
  push:
    branches:
      - v786-calibration-shadow-v1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Shadow JS
        run: |
          node --check www/calibration-shadow-v1.js
          node --check www/dispersion-shadow-live.js

      - name: Inject Shadow modules into build only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          tags = [
              '<script src="calibration-shadow-v1.js"></script>',
              '<script src="dispersion-shadow-live.js"></script>',
          ]
          if "</body>" not in s:
              raise SystemExit("ERROR: </body> not found in www/index.html")
          for tag in tags:
              if tag not in s:
                  s = s.replace("</body>", tag + "\n</body>", 1)
          p.write_text(s, encoding="utf-8")
          print("Shadow module injection OK")
          PY

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLB-Totals-Lab-V7.8.7.1-Dispersion-Live-Shadow
          path: android/app/build/outputs/apk/debug/app-debug.apk
