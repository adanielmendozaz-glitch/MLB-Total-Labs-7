name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - android-v7
      - v1-sqlite

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install dependencies
        run: npm ci

      - name: Create Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Install permanent signing key
        env:
          MLB_KEYSTORE: ${{ secrets.MLB_DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$HOME/.android"
          echo "$MLB_KEYSTORE" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

          cp "$HOME/.android/debug.keystore" android/app/debug.keystore

          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Build APK with permanent signature
        run: |
          cd android
          chmod +x gradlew

          ./gradlew assembleDebug \
            -Pandroid.injected.signing.store.file="$HOME/.android/debug.keystore" \
            -Pandroid.injected.signing.store.password=android \
            -Pandroid.injected.signing.key.alias=androiddebugkey \
            -Pandroid.injected.signing.key.password=android

      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)

          "$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk

          APK_SHA=$("$APKSIGNER" verify --print-certs \
            android/app/build/outputs/apk/debug/app-debug.apk \
            | awk -F': ' '/certificate SHA-256 digest/{print tolower($2); exit}')

          EXPECTED="06c224aeb153d3d983cd59426da3513820651a2f2687fb40fbb703d5cfc05afe"

          echo "APK:      $APK_SHA"
          echo "EXPECTED: $EXPECTED"

          test "$APK_SHA" = "$EXPECTED"

      - name: Collect APK
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk MLB_Total_Labs_7_V1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLB_Total_Labs_7_V1_APK
          path: MLB_Total_Labs_7_V1-debug.apk
          retention-days: 30
