name: Build MLB Totals Lab V7.8.6 Calibration Shadow V1 APK

on:
  workflow_dispatch:
  push:
    branches:
      - v786-calibration-shadow-v1

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Calibration Shadow JS
        run: node --check www/calibration-shadow-v1.js

      - name: Inject Calibration Shadow V1 into build only
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("www/index.html")
          s = p.read_text(encoding="utf-8")
          tag = '<script src="calibration-shadow-v1.js"></script>'
          if tag not in s:
              if "</body>" not in s:
                  raise SystemExit("ERROR: </body> not found in www/index.html")
              s = s.replace("</body>", tag + "\n</body>", 1)
              p.write_text(s, encoding="utf-8")
          print("Calibration Shadow injection OK")
          PY

      - name: Capacitor Sync
        run: npx cap sync android

      - name: Make Gradle executable
        run: chmod +x android/gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MLB-Totals-Lab-V7.8.6-Calibration-Shadow-V1
          path: android/app/build/outputs/apk/debug/app-debug.apk
